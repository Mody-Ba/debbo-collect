spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/debbo_collect?tcpKeepAlive=true&connectTimeout=10&socketTimeout=60}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.minimum-idle=1

spring.jpa.show-sql=false

spring.liquibase.change-log=classpath:db/changelog-master.yaml
spring.liquibase.enabled=true
spring.jpa.hibernate.ddl-auto=none

spring.servlet.multipart.max-file-size=35MB
spring.servlet.multipart.max-request-size=40MB

server.port=${PORT:8080}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}